<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>Smart Scouter</title>
    <style>
      :root {
        color: #0f172a;
        font-family: Inter, "Segoe UI", Arial, Helvetica, sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, rgba(31, 182, 255, 0.72), rgba(52, 211, 153, 0.72), rgba(250, 204, 21, 0.72));
      }

      main {
        width: min(88vw, 420px);
        border: 1px solid rgba(255, 255, 255, 0.48);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.58);
        padding: 28px;
        box-shadow: 0 28px 90px rgba(15, 23, 42, 0.22);
        backdrop-filter: blur(22px);
      }

      h1 {
        margin: 0;
        font-size: 2rem;
      }

      p {
        margin: 12px 0 0;
        line-height: 1.6;
        font-weight: 650;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Smart Scouter</h1>
      <p>You are offline. Reconnect to continue company search, scoring, and reporting.</p>
    </main>
  </body>
</html>
